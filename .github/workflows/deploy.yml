name: Build and Push Frontend Image to ACR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acr-image
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load frontend build env
        run: |
          grep -v '^#' .env.production | grep -v '^$' >> "$GITHUB_ENV"

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}
          build-args: |
            VITEPRESS_SITE_HOSTNAME=${{ env.VITEPRESS_SITE_HOSTNAME }}
            VITEPRESS_ASSET_BASE=${{ env.VITEPRESS_ASSET_BASE }}
            VITEPRESS_ARTALK_SERVER=${{ env.VITEPRESS_ARTALK_SERVER }}
            VITEPRESS_BUSUANZI_SCRIPT_URL=${{ env.VITEPRESS_BUSUANZI_SCRIPT_URL }}
