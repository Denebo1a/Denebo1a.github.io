version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-gateway
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl
    restart: unless-stopped
    depends_on:
      - frontend
      - artalk
      - bsz
    networks:
      - web-gateway

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: deneblog-frontend
    env_file:
      - ./.env
    volumes:
      - ../docs/.vitepress/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - web-gateway

  artalk:
    image: artalk/artalk-go
    container_name: artalk
    env_file:
      - ./.env
    volumes:
      - ./artalk/data:/data
    environment:
      TZ: ${TZ}
      ATK_LOCALE: zh-CN
      ATK_SITE_DEFAULT: DeneBlog
      ATK_SITE_URL: ${SITE_URL}
    restart: unless-stopped
    networks:
      - web-gateway

  redis:
    image: redis:alpine
    container_name: bsz-redis
    env_file:
      - ./.env
    volumes:
      - ./busuanzi/data/redis:/data
    restart: unless-stopped
    networks:
      - web-gateway

  bsz:
    image: crpi-mgfx1en0jnkhva3d.cn-hangzhou.personal.cr.aliyuncs.com/denebo1a/busuanzi:v2
    container_name: bsz
    env_file:
      - ./.env
    volumes:
      - /data/bsz:/app/expose
    depends_on:
      - redis
    environment:
      WEB_LOG: true
      WEB_DEBUG: false
      WEB_CORS: "*"
      BSZ_EXPIRE: 0
      BSZ_SECRET: bsz
      API_SERVER: ${SITE_URL}/busuanzi
      REDIS_ADDRESS: redis:6379
      BSZ_PATHSTYLE: true
      BSZ_ENCRYPT: MD516
    restart: unless-stopped
    networks:
      - web-gateway

networks:
  web-gateway:
    external: true
