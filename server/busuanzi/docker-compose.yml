version: "3.8"

services:
  redis:
    image: "redis:alpine"
    container_name: bsz-redis
    env_file:
      - ../.env
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    networks:
      - web-gateway

  bsz:
    image: crpi-mgfx1en0jnkhva3d.cn-hangzhou.personal.cr.aliyuncs.com/denebo1a/busuanzi:v2
    container_name: bsz
    env_file:
      - ../.env
    volumes:
      - /data/bsz:/app/expose
    depends_on:
      - redis
    environment:
      WEB_LOG: true
      WEB_DEBUG: false
      WEB_CORS: "*"
      BSZ_EXPIRE: 0
      BSZ_SECRET: "bsz"
      API_SERVER: "${SITE_URL}/busuanzi"
      REDIS_ADDRESS: redis:6379
      BSZ_PATHSTYLE: true
      BSZ_ENCRYPT: MD516
    restart: unless-stopped
    networks:
      - web-gateway

networks:
  web-gateway:
    external: true