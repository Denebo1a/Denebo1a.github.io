version: "3.8"

services:
  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: deneblog-frontend
    env_file:
      - ../.env
    volumes:
      - ../../docs/.vitepress/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - web-gateway

networks:
  web-gateway:
    external: true
